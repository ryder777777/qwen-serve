name: qwen3.8-3090-sglang-validate

on:
  push:
    branches: [main]
    paths:
      - 'qwen3.8/3090-sglang/**'
      - .github/workflows/qwen3.8-3090-sglang-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate entrypoint
        run: qwen3.8/3090-sglang/test/entrypoint-test.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: qwen3.8/3090-sglang
          platforms: linux/amd64
          push: false
          tags: qwen38-3090-sglang:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
