<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen3.8-27B · 3090 scaling · speeds & context</title>
<style>
:root{--bg:#0b0c0e;--panel:#121316;--line:#232529;--txt:#e8e9ec;--dim:#8b8e96;--ok:#9ece6a;--bad:#f7768e;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif;padding:40px 24px;max-width:1120px;margin:0 auto}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.badge{display:inline-block;font:11px/1 var(--mono);border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--dim);margin:4px 6px 0 0}
.badge b{color:var(--txt);font-weight:500}
.badge.on{border-color:#2d3a2a;color:var(--ok)}
.badge.off{border-color:#3a2a2e;color:var(--bad)}
h2.cfg{font-size:17px;font-weight:650;margin:34px 0 10px;display:flex;align-items:center;gap:10px}
h2.cfg .n{font:600 11px var(--mono);color:#0b0c0e;background:var(--ok);border-radius:6px;padding:4px 7px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font:600 28px/1.2 var(--mono);margin-top:6px}
.kpi .d{color:var(--dim);font-size:11.5px;margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.panel h3{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--txt)}
.panel .note{color:var(--dim);font-size:11.5px;margin:-8px 0 14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
th{color:var(--dim);font-weight:500;text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}th:first-child,td:first-child{text-align:left}
.pos{color:var(--ok)}
footer{color:var(--dim);font-size:12px;margin-top:26px;line-height:1.7}
.loading{color:var(--dim);font:12px var(--mono);padding:30px 0}
</style></head><body>
<h1>Qwen3.8-27B — 3090 scaling</h1>
<div class="sub">speed · max KV context · modality support · sglang main + DSpark speculative decoding</div>
<div style="margin-top:12px">
<span class="badge">target <b>cyankiwi AWQ-INT4 W4A16</b></span>
<span class="badge">draft <b>RadixArk DSpark 1.36B</b></span>
<span class="badge">P2P <b>BAR1 256M · RBAR off</b></span>
<span class="badge">greedy · /no_think</span>
</div>
<div id="root"><div class="loading">loading results…</div></div>
<footer id="ft"></footer>
<script>
const COLORS=["#7aa2f7","#9ece6a","#e0af68","#bb9af7"];
const fmt=n=>n==null?"–":n>=1000?(n/1000).toFixed(1)+"k":Math.round(n);
function barChart(rows,ykey,unit){
  const groups=[...new Set(rows.map(r=>r.len))].sort((a,b)=>a-b);
  const series=[...new Set(rows.map(r=>r.conc))].sort((a,b)=>a-b);
  const W=1040,H=260,padL=54,padB=30,padT=10;
  const max=Math.max(...rows.map(r=>r[ykey]||0))*1.12||1;
  const gw=W-padL-8,gwI=gw/groups.length;let s=`<svg width="100%" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const y=padT+(H-padT-padB)*i/4;
    s+=`<line x1="${padL}" x2="${W-8}" y1="${y}" y2="${y}" stroke="#232529"/>`;
    s+=`<text x="${padL-7}" y="${y+4}" fill="#8b8e96" font-size="10" text-anchor="end" font-family="ui-monospace">${fmt(max*(4-i)/4)}</text>`;}
  groups.forEach((g,gi)=>{const xr=padL+gwI*gi,bw=gwI/series.length;
    series.forEach((se,si)=>{const r=rows.find(x=>x.len==g&&x.conc==se);if(!r)return;
      const h=(H-padT-padB)*(r[ykey]||0)/max,x=xr+bw*si+3.5,y=H-padB-h,w=bw-7;
      s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3.5" fill="${COLORS[si%4]}"><title>${g/1024}k · c=${se}: ${Math.round(r[ykey])} ${unit}</title></rect>`;});
    s+=`<text x="${xr+gwI/2}" y="${H-10}" fill="#8b8e96" font-size="10.5" text-anchor="middle">${g>=1024?g/1024+"k":g}</text>`;});
  return {svg:s+"</svg>",legend:`<div class="legend">`+series.map((se,i)=>`<span><i style="background:${COLORS[i%4]}"></i>concurrency ${se}</span>`).join("")+`</div>`};
}
function table(rows){
  let t=`<tr><th>ctx</th><th>conc</th><th>TTFT s</th><th>prefill tok/s</th><th>decode tok/s</th><th>agg tok/s</th></tr>`;
  rows.sort((a,b)=>a.len-b.len||a.conc-b.conc).forEach(r=>{
    t+=`<tr><td>${r.len/1024}k</td><td>${r.conc}</td><td>${r.ttft??"–"}</td><td>${fmt(r.prefill_tps)}</td><td class="pos">${Math.round(r.decode_tps_total)}</td><td>${fmt(Math.round(r.decode_tps_total*r.conc))}</td></tr>`;});
  return `<table>${t}</table>`;
}
const F=n=>fetch(n).then(r=>r.ok?r.json():null).catch(()=>null);
(async()=>{
  const [r1,r2,r4,m1,m2,m4,k1,k2,k4]=await Promise.all([
    F("tp1-results.json"),F("tp2-results.json"),F("tp4-results.json"),
    F("tp1-mm.json"),F("tp2-mm.json"),F("tp4-mm.json"),
    fetch("tp1-kv.txt").then(r=>r.ok?r.text():null).catch(()=>null),
    fetch("tp2-kv.txt").then(r=>r.ok?r.text():null).catch(()=>null),
    fetch("tp4-kv.txt").then(r=>r.ok?r.text():null).catch(()=>null)]);
  const kvParse=t=>{if(!t)return{};const m=t.match(/max_total_num_tokens=(\d+)/);const mr=t.match(/max_running_requests=(\d+)/);const cl=t.match(/context_len=(\d+)/);const toks=t.match(/#tokens: (\d+)/);return{tokens:m?+m[1]:(toks?+toks[1]:null),maxreq:mr?+mr[1]:null,ctx:cl?+cl[1]:null};};
  const mm=(arr,tag)=>Array.isArray(arr)?arr.find(x=>x.tag==tag)||{ok:false}:(arr||{}).tag==tag?arr:{ok:false};
  const cfgs=[
    {n:1,res:r1,mm:m1,kv:k1,video:false},
    {n:2,res:r2,mm:m2,kv:k2,video:true},
    {n:4,res:r4,mm:m4,kv:k4,video:true},
  ];
  let html="";
  for(const c of cfgs){
    const kv=kvParse(c.kv), rows=(c.res||[]).filter(r=>r.decode_tps_total!=null);
    const img=mm(c.mm,"image-base64"),vid=mm(c.mm,"video-base64");
    const best=rows.length?Math.max(...rows.map(r=>r.decode_tps_total)):null;
    const bestAgg=rows.length?Math.max(...rows.map(r=>r.decode_tps_total*r.conc)):null;
    const bestPre=rows.length?Math.max(...rows.map(r=>r.prefill_tps)):null;
    const t128=rows.filter(r=>r.len==131072&&r.conc==1)[0];
    html+=`<h2 class="cfg"><span class="n">${c.n}×</span> RTX 3090${c.n>1?"s":""} · TP=${c.n}</h2>
    <span class="badge ${img.ok?"on":"off"}">image ${img.ok?"supported":"✗"}</span>
    <span class="badge ${vid.ok?"on":(c.video?"off":"")}">${vid.ok?"video supported":(c.video?"video ✗":"video n/a (1 GPU)")}</span>
    ${kv.tokens?`<span class="badge">KV pool <b>${fmt(kv.tokens)} tokens</b></span>`:""}
    ${kv.maxreq?`<span class="badge">max concurrent <b>${kv.maxreq}</b></span>`:""}
    <span class="badge">dtype <b>bf16 KV</b></span>
    <div class="kpis">
      <div class="kpi"><div class="l">Max KV context</div><div class="v">${kv.tokens?fmt(kv.tokens):"–"}<span style="font-size:13px;color:var(--dim)"> tok</span></div><div class="d">native ctx ${kv.ctx?fmt(kv.ctx):"262k"} · pool-limited</div></div>
      <div class="kpi"><div class="l">Peak decode</div><div class="v">${best?Math.round(best):"–"}<span style="font-size:13px;color:var(--dim)"> tok/s</span></div><div class="d">single stream</div></div>
      <div class="kpi"><div class="l">Peak aggregate</div><div class="v">${bestAgg?fmt(Math.round(bestAgg)):"–"}<span style="font-size:13px;color:var(--dim)"> tok/s</span></div><div class="d">all streams</div></div>
      <div class="kpi"><div class="l">Peak prefill</div><div class="v">${bestPre?fmt(bestPre):"–"}<span style="font-size:13px;color:var(--dim)"> tok/s</span></div><div class="d">${t128?"TTFT@128k "+t128.ttft+"s":""}</div></div>
    </div>`;
    if(rows.length){
      const d=barChart(rows,"decode_tps_total","tok/s"),p=barChart(rows,"prefill_tps","tok/s");
      html+=`<div class="panel"><h3>Decode throughput (tok/s)</h3>${d.legend}${d.svg}</div>
      <div class="panel"><h3>Prefill throughput (tok/s)</h3>${p.legend}${p.svg}</div>
      <div class="panel"><h3>Matrix</h3><div class="note">TTFT · prefill · decode · aggregate</div><div style="overflow-x:auto">${table(rows)}</div></div>`;
    } else html+=`<div class="panel"><div class="loading">no benchmark data</div></div>`;
  }
  document.getElementById("root").innerHTML=html;
  document.getElementById("ft").innerHTML=`Measured ${new Date().toISOString().slice(0,16).replace("T"," ")} UTC · omarchy (EPYC 7443P, PCIe, no NVLink, no RBAR). Greedy, /no_think, 256 out-tokens, streaming. TP4: full matrix c1/2/4/8 × 8–128k. TP1/TP2: c1/4/8 × 8k/32k/128k. DSpark acceptance varies with content; coding filler used.`;
})();
</script></body></html>
